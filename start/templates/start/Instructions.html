{% block title %}
{% endblock %}

{% block content %}

<div class="card bg-light m-3">
    <div class="card-body">
        
        {% if instructions_url %}
        <iframe
            src="{{ instructions_url }}"
            width="100%"
            height="800px"
            style="border: 1px solid #ccc;">
        </iframe>
        {% else %}
        <p class="text-muted">No instructions document has been configured.</p>
        {% endif %}

    </div>
</div>

<div class="text-center">
    <form method="post">
        <button class="btn btn-primary btn-lg">Start</button>
    </form>
</div>

{% endblock %}
